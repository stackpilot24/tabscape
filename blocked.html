<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stay focused</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    :root { --accent: #e23636; }
    body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #1d1f2b, #08090d 70%); color: #fff; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; text-align: center; padding: 24px; }
    main { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; }
    .ring { font-size: 3rem; }
    h1 { font-size: 2rem; font-weight: 600; }
    p { opacity: .75; line-height: 1.5; }
    #site { color: var(--accent); font-weight: 600; }
    #left { font-size: 3.4rem; font-weight: 200; font-variant-numeric: tabular-nums; }
    #focus { font-style: italic; opacity: .9; }
    .row { display: flex; gap: 10px; margin-top: 8px; }
    a, button { border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; cursor: pointer; text-decoration: none; }
    .primary { background: var(--accent); color: #000; font-weight: 600; }
    .ghost { background: #ffffff14; color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="ring">🎯</div>
    <h1>Stay focused</h1>
    <p><span id="site"></span> is blocked during your focus session.</p>
    <p id="focus" hidden></p>
    <div id="left"></div>
    <div class="row">
      <a class="primary" href="newtab.html">Back to dashboard</a>
      <a class="ghost" id="go" hidden>Continue to site</a>
    </div>
  </main>
  <script src="apps.js"></script>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
