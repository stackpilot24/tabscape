<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="intro">
  <div id="bg"></div><div id="live"></div><div id="dim"></div>
  <header>
    <span id="weather"></span>
    <nav>
      <button id="nextWp" class="hbtn" title="Next wallpaper (W)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
      <button id="paletteBtn" class="hbtn" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button id="zenBtn" class="hbtn" title="Zen mode (Z)"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      <button id="editBtn" class="hbtn" title="Arrange widgets (E)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <button id="customBtn" class="hbtn" title="Customize (C)"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      <a id="gear" class="hbtn" href="options.html" title="All settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
    </nav>
  </header>
  <main>
    <section id="hero">
      <div id="clock" title="Click to toggle 12h/24h"></div>
      <div id="date"></div>
      <div id="greeting"></div>
      <div id="focus"></div>
      <form id="search">
        <select id="engine"></select>
        <input id="q" type="text" placeholder="Search or type a URL  ( / )" autocomplete="off" role="combobox" aria-controls="suggest">
      </form>
      <ul id="suggest" role="listbox" hidden></ul>
    </section>
    <div id="grid"></div>
    <aside id="widgets"></aside>
  </main>
  <a id="credit" target="_blank" rel="noopener"></a>

  <!-- App dock: buttons come from settings (S.dock); locked by default -->
  <nav id="apps" aria-label="Apps"></nav>
  <div id="aibar">
    <button id="aiToggle" aria-expanded="false" aria-controls="aiList" title="AI tools">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="4"/><rect x="3" y="13" width="8" height="8" rx="4"/><path d="M13 13h8v4a4 4 0 0 1-4 4h-4z"/></svg></span>
      <span>AI Tools</span>
    </button>
    <i class="sep"></i>
    <nav id="aiList" aria-label="AI tools"></nav>
  </div>

  <div id="palette" hidden>
    <div class="pbox">
      <input id="pq" placeholder="Jump to a link, change scene, layout…" autocomplete="off">
      <ul id="plist"></ul>
      <div class="phint">↑↓ to move · Enter to run · Esc to close</div>
    </div>
  </div>
  <aside id="drawer" hidden></aside>
  <div id="editbar" hidden></div>
  <div id="wpanel" hidden></div>

  <div id="welcome" hidden></div>

  <script src="apps.js"></script>
  <script src="shared.js"></script>
  <script src="profiles.js"></script>
  <script src="live.js"></script>
  <script src="widgetlayout.js"></script>
  <script src="widgets.js"></script>
  <script src="welcome.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
