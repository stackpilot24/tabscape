<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="intro">
  <div id="bg"></div><div id="live"></div><div id="dim"></div>
  <header>
    <span id="weather"></span>
    <nav>
      <button id="nextWp" class="hbtn" title="Next wallpaper (W)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
      <button id="paletteBtn" class="hbtn" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button id="zenBtn" class="hbtn" title="Zen mode (Z)"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      <button id="editBtn" class="hbtn" title="Arrange widgets (E)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <button id="customBtn" class="hbtn" title="Customize (C)"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      <a id="gear" class="hbtn" href="options.html" title="All settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
    </nav>
  </header>
  <main>
    <section id="hero">
      <div id="clock" title="Click to toggle 12h/24h"></div>
      <div id="date"></div>
      <div id="greeting"></div>
      <form id="search">
        <select id="engine"></select>
        <input id="q" type="text" placeholder="Search or type a URL  ( / )" autocomplete="off">
      </form>
    </section>
    <div id="grid"></div>
    <aside id="widgets"></aside>
  </main>
  <a id="credit" target="_blank" rel="noopener"></a>

  <!-- Fixed app dock: always shown, not configurable -->
  <nav id="apps" aria-label="Apps">
    <a href="https://www.youtube.com" style="--c:#ff0033" data-name="YouTube"><svg viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11" rx="3.5" fill="#fff"/><path d="M10.5 9.6v4.8l4.2-2.4z" fill="#ff0033"/></svg></a>
    <a href="https://mail.google.com" style="--c:#ffffff" data-name="Gmail"><svg viewBox="0 0 24 24"><path d="M4 8.2v9.3h3v-7.1z" fill="#4285f4"/><path d="M17 10.4v7.1h3V8.2z" fill="#34a853"/><path d="M4 8.2 12 14l8-5.8V7.3c0-1.2-1.4-1.9-2.4-1.2L12 10.3 6.4 6.1C5.4 5.4 4 6.1 4 7.3z" fill="#ea4335"/><path d="M17 10.4V6.4l3 1.8z" fill="#fbbc04"/><path d="M7 10.4V6.4L4 8.2z" fill="#c5221f"/></svg></a>
    <a href="https://web.telegram.org" style="--c:#2aabee" data-name="Telegram"><svg viewBox="0 0 24 24"><path d="M5.4 11.6 17 7.1c.6-.2 1.1.1.9.9l-2 9.3c-.1.6-.6.8-1.1.5l-3-2.2-1.5 1.4c-.2.2-.3.3-.6.3l.2-3.1 5.6-5.1c.2-.2 0-.3-.4-.1l-6.9 4.4-3-.9c-.6-.2-.6-.6.2-.9z" fill="#fff"/></svg></a>
    <a href="https://web.whatsapp.com" style="--c:#25d366" data-name="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 4.6a7.4 7.4 0 0 0-6.4 11.2l-1 3.6 3.7-1A7.4 7.4 0 1 0 12 4.6z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.4 8.3c.2-.4.4-.4.6-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .4-.1.6l-.4.5c-.1.1-.1.3 0 .5.4.7 1.3 1.6 2.1 2 .2.1.4.1.5 0l.5-.6c.2-.2.4-.2.6-.1l1.5.7c.2.1.4.3.3.5 0 .5-.2 1.2-.8 1.5-.6.3-1.6.4-3.2-.4-1.5-.8-2.8-2.3-3.3-3.4-.5-1.1-.3-2 0-2.4z" fill="#fff"/></svg></a>
    <a href="https://x.com" style="--c:#1d9bf0" data-name="Twitter"><svg viewBox="0 0 24 24"><path transform="translate(5.4 5.6) scale(.55)" d="M23.95 4.57a10 10 0 0 1-2.82.77 4.96 4.96 0 0 0 2.16-2.72c-.95.56-2 .96-3.12 1.19a4.92 4.92 0 0 0-8.38 4.48A13.94 13.94 0 0 1 1.64 3.16a4.92 4.92 0 0 0 1.52 6.57 4.9 4.9 0 0 1-2.23-.62v.06a4.92 4.92 0 0 0 3.95 4.83 4.96 4.96 0 0 1-2.21.08 4.93 4.93 0 0 0 4.6 3.42A9.87 9.87 0 0 1 0 19.54a13.94 13.94 0 0 0 7.55 2.21c9.05 0 14-7.5 14-13.98 0-.21 0-.42-.02-.63A9.94 9.94 0 0 0 24 4.59z" fill="#fff"/></svg></a>
    <a href="https://discord.com/app" style="--c:#5865f2" data-name="Discord"><svg viewBox="0 0 24 24"><path d="M7.1 8.3c1.5-.8 3.1-1.1 4.9-1.1s3.4.3 4.9 1.1c1.3 2 1.9 4.3 1.8 6.8-1.3 1-2.7 1.6-4.1 2l-.9-1.4c.6-.2 1.2-.5 1.7-.9l-.5-.4a9.4 9.4 0 0 1-5.8 0l-.5.4c.5.4 1.1.7 1.7.9l-.9 1.4c-1.4-.4-2.8-1-4.1-2-.1-2.5.5-4.8 1.8-6.8z" fill="#fff"/><circle cx="9.8" cy="12.6" r="1.15" fill="#5865f2"/><circle cx="14.2" cy="12.6" r="1.15" fill="#5865f2"/></svg></a>
  </nav>

  <div id="palette" hidden>
    <div class="pbox">
      <input id="pq" placeholder="Jump to a link, change scene, layout…" autocomplete="off">
      <ul id="plist"></ul>
      <div class="phint">↑↓ to move · Enter to run · Esc to close</div>
    </div>
  </div>
  <aside id="drawer" hidden></aside>
  <div id="editbar" hidden></div>
  <div id="wpanel" hidden></div>

  <script src="shared.js"></script>
  <script src="live.js"></script>
  <script src="widgetlayout.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
